          cat > 'app/src/main/java/es/smcehegin/app/Avisador.java' <<'FIN_DEL_ARCHIVO'
          package es.smcehegin.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;

          /**
           * Novedades en segundo plano: cada ~30 minutos pregunta a la app (Google Apps Script)
           * si hay cambios en la agenda, menciones, partituras o avisos, y los muestra como notificación.
           */
          public class Avisador extends JobService {

              static final String CLAVE = "noti";
              static final String DESDE = "notiDesde";
              private static final int TRABAJO = 7;
              private static final int TRABAJO_YA = 8;
              private static final String CANAL = "avisos_banda";

              static void programar(Context c, boolean comprobarYa) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js == null) return;
                  ComponentName yo = new ComponentName(c, Avisador.class);
                  if (js.getPendingJob(TRABAJO) == null) {
                      js.schedule(new JobInfo.Builder(TRABAJO, yo)
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setPeriodic(15 * 60 * 1000L)
                          .setPersisted(true)
                          .build());
                  }
                  if (comprobarYa) {
                      js.schedule(new JobInfo.Builder(TRABAJO_YA, yo)
                          .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                          .setOverrideDeadline(5000)
                          .build());
                  }
              }

              static void cancelar(Context c) {
                  JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                  if (js != null) { js.cancel(TRABAJO); js.cancel(TRABAJO_YA); }
              }

              @Override
              public boolean onStartJob(JobParameters p) {
                  new Thread(() -> {
                      try { comprobar(getApplicationContext()); } catch (Exception e) { /* sin conexión: se reintenta en la próxima vuelta */ }
                      jobFinished(p, false);
                  }).start();
                  return true;
              }

              @Override
              public boolean onStopJob(JobParameters p) { return true; }

              static void comprobar(Context c) throws Exception {
                  SharedPreferences sp = c.getSharedPreferences("smc", Context.MODE_PRIVATE);
                  String url = sp.getString(CLAVE, "");
                  if (url == null || url.isEmpty()) return;
                  String desde = sp.getString(DESDE, "");
                  HttpURLConnection con = (HttpURLConnection) new URL(url + "&d=" + URLEncoder.encode(desde == null ? "" : desde, "UTF-8")).openConnection();
                  con.setInstanceFollowRedirects(true);
                  con.setConnectTimeout(20000);
                  con.setReadTimeout(30000);
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(con.getInputStream(), StandardCharsets.UTF_8))) {
                      String l; while ((l = r.readLine()) != null) sb.append(l);
                  } finally { con.disconnect(); }
                  JSONObject o = new JSONObject(sb.toString());
                  if (o.has("error")) {
                      if ("clave".equals(o.optString("error"))) { sp.edit().remove(CLAVE).remove(DESDE).apply(); cancelar(c); }
                      return;
                  }
                  JSONArray l = o.optJSONArray("l");
                  if (l != null && l.length() > 0) {
                      crearCanal(c);
                      int total = o.optInt("total", l.length());
                      if (l.length() <= 4 && total <= 4) {
                          for (int i = 0; i < l.length(); i++) {
                              JSONObject n = l.getJSONObject(i);
                              mostrar(c, n.optString("id").hashCode(), n.optString("titulo"), n.optString("texto"), n.optString("vista"));
                          }
                      } else {
                          StringBuilder t = new StringBuilder();
                          for (int i = l.length() - 1; i >= 0 && i >= l.length() - 5; i--) t.append(l.getJSONObject(i).optString("titulo")).append('\n');
                          mostrar(c, 1, "Tienes " + total + " novedades en la app", t.toString().trim(), "");
                      }
                  }
                  String ultimo = o.optString("ultimo", "");
                  if (!ultimo.isEmpty()) sp.edit().putString(DESDE, ultimo).apply();
              }

              private static void crearCanal(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  if (nm.getNotificationChannel("novedades") != null) nm.deleteNotificationChannel("novedades");
                  if (nm.getNotificationChannel(CANAL) != null) return;
                  NotificationChannel ch = new NotificationChannel(CANAL, "Avisos de la banda", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Agenda, menciones, partituras y avisos");
                  ch.enableVibration(true);
                  ch.enableLights(true);
                  ch.setLightColor(Color.parseColor("#d4b46a"));
                  ch.setShowBadge(true);
                  ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(ch);
              }

              private static void mostrar(Context c, int id, String titulo, String texto, String vista) {
                  Intent i = new Intent(c, MainActivity.class);
                  if (vista != null && !vista.isEmpty()) i.putExtra("vista", vista);
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(c, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, CANAL) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_noti)
                      .setColor(Color.parseColor("#13213f"))
                      .setContentTitle(titulo)
                      .setContentText(texto)
                      .setStyle(new Notification.BigTextStyle().bigText(texto))
                      .setAutoCancel(true)
                      .setCategory(Notification.CATEGORY_MESSAGE)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setPriority(Notification.PRIORITY_HIGH)
                      .setDefaults(Notification.DEFAULT_ALL)
                      .setContentIntent(pi);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  try { if (nm != null) nm.notify(id, b.build()); } catch (SecurityException e) { /* sin permiso de notificaciones */ }
              }
          }
