name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Crear el proyecto Android (App SMC 3.6.2)
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'FIN_DEL_ARCHIVO'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SMC Cehegin'
          include ':app'
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'FIN_DEL_ARCHIVO'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'FIN_DEL_ARCHIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'FIN_DEL_ARCHIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'es.smcehegin.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'es.smcehegin.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 362
                  versionName '3.6.2'
              }

              signingConfigs {
                  release {
                      storeFile file('smc-cehegin.jks')
                      storePassword 'smcCehegin1992'
                      keyAlias 'smc'
                      keyPassword 'smcCehegin1992'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="webcal" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.GET_CONTENT" />
                      <data android:mimeType="*/*" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Tema"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <!-- Novedades en segundo plano: consulta la app cada ~30 min y muestra la notificación -->
                  <service
                      android:name=".Avisador"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
              </application>
          </manifest>
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SMC Cehegín</string>
              <!-- Opcional: pega aquí la dirección de la app (la que termina en /exec) y no se preguntará al abrirla. -->
              <string name="url_app" translatable="false">https://script.google.com/macros/s/AKfycbxcV5oP1aR-JpZwgljmdFa0kvgkQv6nCynV-gQZB9G3n46o97PDWISj8IeC2ob-2eXU/exec</string>
          </resources>
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Tema" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">#13213f</item>
                  <item name="android:colorPrimaryDark">#13213f</item>
                  <item name="android:colorAccent">#86672f</item>
                  <item name="android:statusBarColor">#13213f</item>
                  <item name="android:navigationBarColor">#13213f</item>
                  <item name="android:windowBackground">#13213f</item>
              </style>
          </resources>
          FIN_DEL_ARCHIVO
          mkdir -p "$(dirname 'app/src/main/java/es/smcehegin/app/MainActivity.java')"
          cat > 'app/src/main/java/es/smcehegin/app/MainActivity.java' <<'FIN_DEL_ARCHIVO'
          package es.smcehegin.app;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.webkit.JavascriptInterface;
          import android.content.pm.PackageManager;
          import android.os.Build;

          /**
           * App SMC · Sociedad Musical de Cehegín.
           * Contenedor nativo de la aplicación web (Google Apps Script): abre la app a pantalla completa,
           * permite subir fotos y PDF, abre WhatsApp, teléfono, mapas, calendario y descargas fuera.
           */
          public class MainActivity extends Activity {

              private static final String PREFS = "smc";
              private static final String CLAVE_URL = "url";
              private static final int PEDIR_ARCHIVO = 41;
              private static final int AZUL = Color.parseColor("#13213f");
              private static final int ORO = Color.parseColor("#d4b46a");
              private static final int DORADO = Color.parseColor("#86672f");

              private FrameLayout raiz;
              private WebView web;
              private ProgressBar barra;
              private View pantallaCompleta;
              private WebChromeClient.CustomViewCallback salirPantallaCompleta;
              private ValueCallback<Uri[]> archivosPendientes;
              private boolean mostrandoError = false;
              private final Navegador navegador = new Navegador();

              @Override
              protected void onCreate(Bundle estado) {
                  super.onCreate(estado);
                  raiz = new FrameLayout(this);
                  raiz.setBackgroundColor(AZUL);
                  setContentView(raiz);

                  String url = urlGuardada();
                  if (url.isEmpty()) mostrarConfiguracion(null);
                  else abrirApp(conVista(url, getIntent()), vistaDe(getIntent()) != null ? null : estado);
              }

              // ------------------------------------------------------------------ dirección de la app
              private SharedPreferences prefs() { return getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              private String urlGuardada() {
                  String u = prefs().getString(CLAVE_URL, "");
                  if (u == null || u.isEmpty()) u = getString(R.string.url_app).trim();
                  return u == null ? "" : u;
              }

              private static String limpiarUrl(String u) {
                  u = u == null ? "" : u.trim();
                  int p = u.indexOf("http");
                  if (p > 0) u = u.substring(p);
                  int esp = u.indexOf(' ');
                  if (esp > 0) u = u.substring(0, esp);
                  if (u.startsWith("http://")) u = "https://" + u.substring(7);
                  // Quitar parámetros de la parte pública u otros
                  int q = u.indexOf('?');
                  if (q > 0) u = u.substring(0, q);
                  return u;
              }

              private static boolean urlValida(String u) {
                  return u.startsWith("https://script.google.com/") && (u.endsWith("/exec") || u.endsWith("/dev"));
              }

              private int dp(float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private void mostrarConfiguracion(String error) {
                  if (web != null) { raiz.removeView(web); web.destroy(); web = null; }
                  raiz.removeAllViews();

                  LinearLayout caja = new LinearLayout(this);
                  caja.setOrientation(LinearLayout.VERTICAL);
                  caja.setGravity(Gravity.CENTER_HORIZONTAL);
                  caja.setPadding(dp(28), dp(56), dp(28), dp(28));

                  ImageView escudo = new ImageView(this);
                  escudo.setImageResource(R.mipmap.ic_launcher);
                  LinearLayout.LayoutParams lpEsc = new LinearLayout.LayoutParams(dp(104), dp(104));
                  lpEsc.bottomMargin = dp(18);
                  caja.addView(escudo, lpEsc);

                  TextView titulo = new TextView(this);
                  titulo.setText("Sociedad Musical\nde Cehegín");
                  titulo.setTextColor(Color.WHITE);
                  titulo.setTextSize(TypedValue.COMPLEX_UNIT_SP, 24);
                  titulo.setTypeface(Typeface.SERIF, Typeface.BOLD);
                  titulo.setGravity(Gravity.CENTER);
                  caja.addView(titulo);

                  TextView ayuda = new TextView(this);
                  ayuda.setText("Pega la dirección de la app que te ha enviado la junta directiva. Empieza por https://script.google.com y termina en /exec. Solo se pide la primera vez.");
                  ayuda.setTextColor(Color.argb(220, 255, 255, 255));
                  ayuda.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  ayuda.setGravity(Gravity.CENTER);
                  ayuda.setPadding(0, dp(18), 0, dp(14));
                  caja.addView(ayuda);

                  if (error != null) {
                      TextView err = new TextView(this);
                      err.setText(error);
                      err.setTextColor(Color.parseColor("#c0392b"));
                      err.setBackgroundColor(Color.WHITE);
                      err.setPadding(dp(12), dp(10), dp(12), dp(10));
                      err.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                      LinearLayout.LayoutParams lpErr = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lpErr.bottomMargin = dp(10);
                      caja.addView(err, lpErr);
                  }

                  final EditText campo = new EditText(this);
                  campo.setHint("https://script.google.com/macros/s/…/exec");
                  campo.setText(prefs().getString(CLAVE_URL, ""));
                  campo.setSingleLine(true);
                  campo.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  campo.setImeOptions(EditorInfo.IME_ACTION_GO);
                  campo.setTextColor(Color.parseColor("#1b1f2a"));
                  campo.setHintTextColor(Color.GRAY);
                  campo.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  campo.setPadding(dp(14), dp(12), dp(14), dp(12));
                  GradientDrawable fondoCampo = new GradientDrawable();
                  fondoCampo.setColor(Color.WHITE);
                  fondoCampo.setCornerRadius(dp(10));
                  campo.setBackground(fondoCampo);
                  caja.addView(campo, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button entrar = new Button(this);
                  entrar.setText("Entrar");
                  entrar.setAllCaps(false);
                  entrar.setTextColor(Color.parseColor("#1b1f2a"));
                  entrar.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
                  entrar.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable fondoBoton = new GradientDrawable();
                  fondoBoton.setColor(ORO);
                  fondoBoton.setCornerRadius(dp(12));
                  entrar.setBackground(fondoBoton);
                  LinearLayout.LayoutParams lpBtn = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(52));
                  lpBtn.topMargin = dp(14);
                  caja.addView(entrar, lpBtn);

                  final Runnable guardar = new Runnable() {
                      @Override public void run() {
                          String u = limpiarUrl(campo.getText().toString());
                          if (!urlValida(u)) {
                              mostrarConfiguracion("Esa dirección no parece la de la app. Debe empezar por https://script.google.com/macros/s/ y terminar en /exec.");
                              return;
                          }
                          prefs().edit().putString(CLAVE_URL, u).apply();
                          abrirApp(u, null);
                      }
                  };
                  entrar.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { guardar.run(); }
                  });
                  campo.setOnEditorActionListener(new TextView.OnEditorActionListener() {
                      @Override public boolean onEditorAction(TextView v, int accion, android.view.KeyEvent e) { guardar.run(); return true; }
                  });

                  android.widget.ScrollView scroll = new android.widget.ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.addView(caja);
                  raiz.addView(scroll, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              // ------------------------------------------------------------------ la app web
              private void abrirApp(String url, Bundle estado) {
                  raiz.removeAllViews();
                  mostrandoError = false;

                  web = new WebView(this);
                  web.setBackgroundColor(AZUL);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(web, true);

                  web.addJavascriptInterface(new Puente(), "SMCApp");
                  web.setWebViewClient(new Cliente());
                  web.setWebChromeClient(navegador);
                  web.setDownloadListener((enlace, agente, disposicion, tipo, tamano) -> abrirFuera(enlace));

                  raiz.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  barra = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  barra.setIndeterminate(false);
                  barra.setMax(100);
                  barra.setProgressTintList(android.content.res.ColorStateList.valueOf(ORO));
                  raiz.addView(barra, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(3), Gravity.TOP));

                  if (estado != null && web.restoreState(estado) != null) return;
                  if (!hayConexion()) { mostrarSinConexion(); return; }
                  web.loadUrl(url);
              }

              private boolean hayConexion() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkInfo n = cm == null ? null : cm.getActiveNetworkInfo();
                      return n == null || n.isConnected();
                  } catch (Exception e) { return true; }
              }

              /** Dentro de la app: Google Apps Script y sus marcos. Fuera: WhatsApp, mapas, calendario, Drive… */
              private static boolean esInterna(Uri u) {
                  String h = u.getHost() == null ? "" : u.getHost().toLowerCase();
                  return h.equals("script.google.com") || h.endsWith(".googleusercontent.com") || h.equals("accounts.google.com")
                      || h.endsWith("youtube-nocookie.com") || h.equals("www.youtube.com") && u.getPath() != null && u.getPath().startsWith("/embed");
              }

              private void abrirFuera(String enlace) {
                  try {
                      Uri u = Uri.parse(enlace);
                      Intent i;
                      if ("intent".equals(u.getScheme())) {
                          i = Intent.parseUri(enlace, Intent.URI_INTENT_SCHEME);
                          i.addCategory(Intent.CATEGORY_BROWSABLE);
                          i.setComponent(null);
                          i.setSelector(null);
                      } else if ("tel".equals(u.getScheme())) {
                          i = new Intent(Intent.ACTION_DIAL, u);
                      } else {
                          i = new Intent(Intent.ACTION_VIEW, u);
                      }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      if (enlace.startsWith("webcal:")) {
                          // Sin app de calendario que acepte webcal: abrir la suscripción en Google Calendar
                          abrirFuera("https://calendar.google.com/calendar/r?cid=" + Uri.encode(enlace));
                      } else {
                          Toast.makeText(this, "No hay ninguna app para abrir este enlace", Toast.LENGTH_LONG).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "No se ha podido abrir el enlace", Toast.LENGTH_LONG).show();
                  }
              }

              private class Cliente extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                      Uri u = req.getUrl();
                      if (!req.isForMainFrame()) return false; // marcos internos (vídeos, vistas de Drive): siempre dentro
                      String esquema = u.getScheme() == null ? "" : u.getScheme();
                      if ("smc".equals(esquema)) {
                          if ("reintentar".equals(u.getHost())) { mostrandoError = false; v.loadUrl(urlGuardada()); }
                          else if ("cambiar".equals(u.getHost())) mostrarConfiguracion(null);
                          return true;
                      }
                      if (("https".equals(esquema) || "http".equals(esquema)) && esInterna(u)) return false;
                      abrirFuera(u.toString());
                      return true;
                  }

                  @Override
                  public void onPageStarted(WebView v, String url, Bitmap icono) { if (barra != null) barra.setVisibility(View.VISIBLE); }

                  @Override
                  public void onPageFinished(WebView v, String url) {
                      if (barra != null) barra.setVisibility(View.GONE);
                      CookieManager.getInstance().flush();
                  }

                  @Override
                  public void onReceivedError(WebView v, WebResourceRequest req, WebResourceError error) {
                      if (req.isForMainFrame() && !mostrandoError) mostrarSinConexion();
                  }
              }

              private void mostrarSinConexion() {
                  mostrandoError = true;
                  String html = "<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>"
                      + "<style>body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;"
                      + "background:#13213f;color:#fff;font-family:sans-serif;text-align:center;padding:24px;box-sizing:border-box}"
                      + "h1{font-size:22px;margin:0 0 10px}p{opacity:.85;line-height:1.5;margin:0 0 24px}"
                      + "a{display:block;width:100%;max-width:320px;box-sizing:border-box;padding:14px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:10px}"
                      + ".a{background:#d4b46a;color:#1b1f2a}.b{border:1px solid rgba(255,255,255,.4);color:#fff}</style></head><body>"
                      + "<div style='font-size:54px'>📶</div><h1>Sin conexión</h1><p>No se puede abrir la app. Comprueba que tienes internet (datos o wifi) e inténtalo de nuevo.</p>"
                      + "<a class='a' href='smc://reintentar'>Reintentar</a><a class='b' href='smc://cambiar'>Cambiar la dirección de la app</a></body></html>";
                  web.loadDataWithBaseURL("https://smc.local/", html, "text/html", "utf-8", null);
              }

              // ------------------------------------------------------------------ notificaciones
              private static String vistaDe(Intent i) {
                  if (i == null) return null;
                  String v = i.getStringExtra("vista");
                  return v != null && v.matches("[a-z]{3,20}") ? v : null;
              }

              private static String conVista(String url, Intent i) {
                  String v = vistaDe(i);
                  if (v == null || url.isEmpty()) return url;
                  return url + (url.contains("?") ? "&" : "?") + "v=" + v;
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  String v = vistaDe(i);
                  if (v != null && web != null) web.loadUrl(conVista(urlGuardada(), i));
              }

              private void pedirPermisoNotificaciones() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{ "android.permission.POST_NOTIFICATIONS" }, 42);
                      return; // la batería se pide la próxima vez, para no juntar dos ventanas
                  }
                  pedirSinAhorroBateria();
              }

              /** Para que el ahorro de batería no retrase los avisos (se pregunta una sola vez). */
              private void pedirSinAhorroBateria() {
                  try {
                      if (prefs().getBoolean("bateriaPedida", false)) return;
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm == null || pm.isIgnoringBatteryOptimizations(getPackageName())) return;
                      prefs().edit().putBoolean("bateriaPedida", true).apply();
                      Intent i = new Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } catch (Exception e) { /* algunos móviles no lo permiten */ }
              }

              /** Lo usa la app web: al entrar le da al móvil su dirección personal de novedades; al salir la borra. */
              public class Puente {
                  @JavascriptInterface
                  public void registrar(String url) {
                      if (url == null || !url.startsWith("https://script.google.com/") || !url.contains("p=noti")) return;
                      boolean nuevo = !url.equals(prefs().getString(Avisador.CLAVE, ""));
                      if (nuevo) prefs().edit().putString(Avisador.CLAVE, url).remove(Avisador.DESDE).apply();
                      runOnUiThread(() -> { pedirPermisoNotificaciones(); Avisador.programar(MainActivity.this, nuevo); });
                  }

                  @JavascriptInterface
                  public void borrar() {
                      prefs().edit().remove(Avisador.CLAVE).remove(Avisador.DESDE).apply();
                      Avisador.cancelar(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void comprobar() { runOnUiThread(() -> Avisador.programar(MainActivity.this, true)); }

                  @JavascriptInterface
                  public String version() { return "3.6.1"; }
              }


              private class Navegador extends WebChromeClient {
                  @Override
                  public void onProgressChanged(WebView v, int progreso) {
                      if (barra == null) return;
                      barra.setProgress(progreso);
                      barra.setVisibility(progreso >= 100 ? View.GONE : View.VISIBLE);
                  }

                  @Override
                  public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> callback, FileChooserParams params) {
                      if (archivosPendientes != null) archivosPendientes.onReceiveValue(null);
                      archivosPendientes = callback;
                      Intent elegir = new Intent(Intent.ACTION_GET_CONTENT);
                      elegir.addCategory(Intent.CATEGORY_OPENABLE);
                      String[] tipos = params.getAcceptTypes();
                      String tipo = "*/*";
                      if (tipos != null && tipos.length > 0 && tipos[0] != null && !tipos[0].trim().isEmpty()) {
                          tipo = tipos.length == 1 ? tipos[0].trim() : "*/*";
                          if (tipos.length > 1) elegir.putExtra(Intent.EXTRA_MIME_TYPES, limpiarTipos(tipos));
                      }
                      if (tipo.startsWith(".")) tipo = tipo.equalsIgnoreCase(".pdf") ? "application/pdf" : "*/*";
                      elegir.setType(tipo);
                      if (params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) elegir.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                      try {
                          startActivityForResult(Intent.createChooser(elegir, "Elegir archivo"), PEDIR_ARCHIVO);
                      } catch (ActivityNotFoundException e) {
                          archivosPendientes = null;
                          Toast.makeText(MainActivity.this, "No hay ninguna app para elegir archivos", Toast.LENGTH_LONG).show();
                          return false;
                      }
                      return true;
                  }

                  @Override
                  public void onShowCustomView(View vista, CustomViewCallback callback) {
                      if (pantallaCompleta != null) { callback.onCustomViewHidden(); return; }
                      pantallaCompleta = vista;
                      salirPantallaCompleta = callback;
                      raiz.addView(vista, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  }

                  @Override
                  public void onHideCustomView() {
                      if (pantallaCompleta == null) return;
                      raiz.removeView(pantallaCompleta);
                      pantallaCompleta = null;
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      if (salirPantallaCompleta != null) salirPantallaCompleta.onCustomViewHidden();
                      salirPantallaCompleta = null;
                  }
              }

              private static String[] limpiarTipos(String[] tipos) {
                  java.util.ArrayList<String> l = new java.util.ArrayList<>();
                  for (String t : tipos) {
                      if (t == null) continue;
                      for (String x : t.split(",")) {
                          x = x.trim();
                          if (x.isEmpty()) continue;
                          if (x.equalsIgnoreCase(".pdf")) x = "application/pdf";
                          if (x.startsWith(".")) continue;
                          l.add(x);
                      }
                  }
                  return l.toArray(new String[0]);
              }

              @Override
              protected void onActivityResult(int codigo, int resultado, Intent datos) {
                  if (codigo != PEDIR_ARCHIVO) { super.onActivityResult(codigo, resultado, datos); return; }
                  if (archivosPendientes == null) return;
                  Uri[] res = null;
                  if (resultado == RESULT_OK && datos != null) {
                      ClipData clip = datos.getClipData();
                      if (clip != null && clip.getItemCount() > 0) {
                          res = new Uri[clip.getItemCount()];
                          for (int i = 0; i < clip.getItemCount(); i++) res[i] = clip.getItemAt(i).getUri();
                      } else if (datos.getData() != null) {
                          res = new Uri[]{ datos.getData() };
                      }
                  }
                  archivosPendientes.onReceiveValue(res);
                  archivosPendientes = null;
              }

              // ------------------------------------------------------------------ ciclo de vida
              @Override
              public void onBackPressed() {
                  if (pantallaCompleta != null) { navegador.onHideCustomView(); return; }
                  if (web != null && web.canGoBack() && !mostrandoError) { web.goBack(); return; }
                  super.onBackPressed();
              }

              @Override
              protected void onSaveInstanceState(Bundle estado) {
                  super.onSaveInstanceState(estado);
                  if (web != null && !mostrandoError) web.saveState(estado);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
